<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HUD top bar and dock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: absolute; inset: 0; pointer-events: none; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #E9EBEE; font-size: 13.5px">
  <header style="position: absolute; top: 16px; left: 16px; right: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
    <a href="Main.dc.html" aria-label="Jarvis home" style="pointer-events: auto; width: 40px; height: 40px; border-radius: 10px; background: #8C9BFF; color: #0D0F12; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4)">J</a>
    <nav aria-label="Breadcrumb" style="pointer-events: auto; display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; background: rgba(20, 23, 28, 0.94); border: 1px solid #2F353E; border-radius: 10px">
      <a href="Main.dc.html" style="color: #A2A9B4; text-decoration: none">Jarvis</a>
      <sc-if value="{{hasWs}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="color: #6B727D">›</span><a href="Workspace.dc.html" style="color: #A2A9B4; text-decoration: none">{{ws}}</a></sc-if>
      <span aria-hidden="true" style="color: #6B727D">›</span><span aria-current="page" style="color: #AEB8FF; font-weight: 600">{{page}}</span>
    </nav>
    <button type="button" style="pointer-events: auto; display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 14px; background: rgba(20, 23, 28, 0.94); border: 1px solid #2F353E; border-radius: 10px; color: #C2C8D1; font: inherit; cursor: pointer">Search <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; border: 1px solid #3A414C; border-radius: 4px; padding: 0 5px; color: #A2A9B4">Ctrl K</span></button>
    <button type="button" aria-pressed="{{awayP}}" onClick="{{toggle}}" style="pointer-events: auto; display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; background: rgba(20, 23, 28, 0.94); border: 1.5px solid {{awayBorder}}; border-radius: 10px; color: #E9EBEE; font: inherit; font-weight: 600; cursor: pointer">I'm away <span style="font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: {{awayBg}}; color: {{awayFg}}">{{awayTxt}}</span></button>
    <div style="flex: 1"></div>
    <span style="pointer-events: auto; display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; background: rgba(20, 23, 28, 0.94); border: 1px solid #2F353E; border-radius: 10px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 50%; background: #4FD1B5"></span>{{status}}</span>
  </header>

  <nav aria-label="Dock" style="pointer-events: auto; position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px); overflow-x: auto; display: flex; align-items: stretch; gap: 2px; padding: 6px; background: rgba(20, 23, 28, 0.96); border: 1px solid #2F353E; border-radius: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5)">
    <sc-for list="{{items}}" as="d" hint-placeholder-count="10">
      <sc-if value="{{d.sep}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 1px; margin: 8px 4px; background: #2F353E"></span></sc-if>
      <sc-if value="{{d.link}}" hint-placeholder-val="{{true}}">
        <a href="{{d.href}}" aria-current="{{d.cur}}" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 64px; min-height: 52px; padding: 4px 8px; border-radius: 10px; text-decoration: none; background: {{d.bg}}; color: {{d.fg}}; font-size: 11.5px; font-weight: 500; white-space: nowrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d.icon}}"></path></svg>
          {{d.label}}
          <sc-if value="{{d.hasBadge}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 2px; right: 10px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: #F2B544; color: #0D0F12; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{d.badge}}</span></sc-if>
        </a>
      </sc-if>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["global","workspace"],"default":"global"},"active":{"editor":"text","default":"Workspaces"},"ws":{"editor":"text","default":""},"page":{"editor":"text","default":"Lobby"},"status":{"editor":"text","default":"3 workspaces"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { away: true }; }
  renderVals() {
    const I = {
      inbox: 'M4 13h4l2 3h4l2-3h4M4 13l2-8h12l2 8v6H4z',
      chat: 'M4 5h16v11H9l-5 4z',
      ws: 'M3 21V9l6-4v16M9 21h12V11l-6-3M13 13h2M13 17h2',
      acct: 'M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5',
      agent: 'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0',
      skill: 'M12 3l2 6 6 3-6 3-2 6-2-6-6-3 6-3z',
      plug: 'M9 3v5M15 3v5M6 8h12v3a6 6 0 01-12 0zM12 17v4',
      usage: 'M5 20V12M10 20V6M15 20v-9M20 20V4',
      clock: 'M12 3a9 9 0 100 18 9 9 0 000-18zM12 7v5l3 2',
      gear: 'M12 9a3 3 0 100 6 3 3 0 000-6zM12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1',
      back: 'M15 5l-7 7 7 7',
      home: 'M4 11l8-7 8 7v9H4z',
      orch: 'M12 3a9 9 0 100 18 9 9 0 000-18zM12 8a4 4 0 100 8 4 4 0 000-8z',
      tasks: 'M8 3h8v3H8zM6 5h12v16H6zM9 13l2 2 4-4',
      branch: 'M6 4v10M18 4a2.5 2.5 0 100 5 2.5 2.5 0 000-5zM6 14a3 3 0 100 6 3 3 0 000-6zM18 9c0 5-12 2-12 5',
      pulse: 'M3 12h4l3-7 4 14 3-7h4',
      folder: 'M3 6h6l2 2h10v11H3z',
      screen: 'M3 4h18v12H3zM8 20h8M12 16v4'
    };
    const g = [
      ['Inbox', 'Inbox.dc.html', I.inbox, '4'], ['Chat', 'JarvisChat.dc.html', I.chat], ['Workspaces', 'Main.dc.html', I.ws], null,
      ['AI Accounts', 'AIAccounts.dc.html', I.acct], ['Agents', 'AgentEditor.dc.html', I.agent], ['Skills', 'AgentEditor.dc.html', I.skill], ['Integrations', 'Integrations.dc.html', I.plug], ['Usage', 'AIAccounts.dc.html', I.usage], null,
      ['Automations', 'Automations.dc.html', I.clock], ['Settings', 'Foundations.dc.html', I.gear]
    ];
    const w = [
      ['Lobby', 'Main.dc.html', I.back], null,
      ['Inbox', 'Inbox.dc.html', I.inbox, '4'], ['Overview', 'Workspace.dc.html', I.home], ['Orchestrator', 'Orchestrator.dc.html', I.orch], ['Tasks', 'Tasks.dc.html', I.tasks], ['Changes', 'Changes.dc.html', I.branch, '2'], ['Activity', 'TaskRun.dc.html', I.pulse], ['Agents', 'AgentEditor.dc.html', I.agent], ['Files', 'Workspace.dc.html', I.folder], ['Preview', 'Workspace.dc.html', I.screen], ['Settings', 'NewWorkspace.dc.html', I.gear]
    ];
    const act = this.props.active || '';
    const items = (this.props.mode === 'workspace' ? w : g).map(d => d ? {
      sep: false, link: true, label: d[0], href: d[1], icon: d[2], badge: d[3] || '', hasBadge: !!d[3],
      cur: d[0] === act ? 'page' : 'false', bg: d[0] === act ? '#262B3A' : 'transparent', fg: d[0] === act ? '#AEB8FF' : '#A2A9B4'
    } : { sep: true, link: false });
    const away = this.state.away;
    return {
      items, ws: this.props.ws || '', hasWs: !!this.props.ws, page: this.props.page || 'Lobby', status: this.props.status || '3 workspaces',
      awayP: away ? 'true' : 'false', awayTxt: away ? 'ON' : 'OFF', awayBg: away ? '#4FD1B5' : '#3A414C', awayFg: away ? '#0D0F12' : '#C2C8D1', awayBorder: away ? '#2D8C77' : '#2F353E',
      toggle: () => this.setState({ away: !away })
    };
  }
}
</script>
</body>
</html>
